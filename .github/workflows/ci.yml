name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install project
        run: >-
          python -m pip install
          --constraint constraints/gateway.txt
          --constraint constraints/ci.txt
          --editable ".[dev,silero-v5]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Check browser JavaScript
        run: |
          node --check src/echoweave/web/app.js
          node --check src/echoweave/web/mic-worklet.js
          node tests/js/test_app_lifecycle.mjs
          node tests/js/test_frontend_contract.mjs
          node tests/js/test_mic_worklet.mjs

      - name: Build and verify reproducible wheel
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheel-one"
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheel-two"
          python scripts/verify_wheel.py "$RUNNER_TEMP/wheel-one" --expected-version 0.2.0
          python scripts/verify_wheel.py "$RUNNER_TEMP/wheel-two" --expected-version 0.2.0
          cmp "$RUNNER_TEMP"/wheel-one/*.whl "$RUNNER_TEMP"/wheel-two/*.whl
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheel-one/*.whl
          python -c "import echoweave; assert echoweave.__version__ == '0.2.0'"
